*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif}

a{color:inherit}img{max-width:100%;display:block}button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--mar);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px dashed var(--ln);display:flex;align-items:center;gap:14px;padding:8px 18px}
header img{height:42px;background:#fff;border-radius:8px}nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}nav a{padding:8px 12px;border-radius:99px;text-decoration:none;white-space:nowrap;font-weight:500}nav a.on,nav a:hover{background:var(--in);color:#fff}

main{max-width:1180px;margin:auto;padding:24px 18px 60px}.btn{display:inline-block;background:var(--in);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:700;text-decoration:none}.btn.m{background:var(--mar);color:#1b1f3a}.btn.o{background:none;border:2px solid var(--in);color:var(--in)}.btn.s{padding:7px 14px;font-size:.9rem}

.two{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pics img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}

dialog{border:0;border-radius:20px;max-width:760px;width:94%;padding:0;background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}.dg{display:grid;grid-template-columns:1fr 1fr}.dg img{width:100%;height:100%;object-fit:cover;min-height:260px}.dg>div{padding:20px}.sg{background:var(--bg);border-radius:12px;padding:12px;margin-top:12px}.sg .li{border:0}
aside{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--card);z-index:40;padding:18px;overflow:auto;transform:translateX(100%);transition:transform .3s;box-shadow:-8px 0 30px #0004}aside.open{transform:none}@media(prefers-reduced-motion:reduce){aside{transition:none}}
.f{display:grid;gap:10px}.faq details{background:var(--card);border-radius:12px;padding:12px 16px;margin-bottom:8px}.faq summary{font-weight:700;cursor:pointer}
footer{background:var(--in);color:#fff;padding:30px 18px;text-align:center}footer a{color:var(--mar)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60}

ame",false,"images/curtain-belt.jpg",[]],["plant-hanger","Plant Hanger",100,"macrame",false,"images/plant-hanger.jpg",[]],["macrame-orn","Macramé Ornaments",100,"decor",true,"images/macrame-orn.jpg",[]],["crochet-orn","Crochet Ornaments",50,"decor",true,"images/crochet-orn.jpg",[]],["tray-s","Tray (small)",400,"stationery",false,"images/tray-s.jpg",[]],["tray-l","Tray (big)",700,"stationery",false,"images/tray-l.jpg",[]],["diary","Diary",250,"stationery",false,"images/diary.jpg",[]],["pencil-acc","Pencil Accessory",100,"stationery",false,"images/pencil-acc.jpg",[]],["bookmarks","Bookmarks",200,"stationery",true,"images/bookmarks.jpg",[]],["diary-pouch","Diary with Pouch",395,"stationery",false,"images/diary-pouch.jpg",[]],["diary-emb","Embroidered Diary",465,"stationery",false,"images/diary-emb.jpg",[]],["sunflower-key","Sunflower Keychain",0,"crochet",false,"images/sunflower-key.jpg",["images/sunflower-key-2.jpg"]],["crochet-bow","Crochet Bow Hair Clips",0,"crochet",false,"images/crochet-bow.jpg",["images/crochet-bow-2.jpg","images/crochet-bow-3.jpg","images/crochet-bow-4.jpg","images/crochet-bow-5.jpg","images/crochet-bow-6.jpg"]],["amigurumi-key","Frog & Astronaut Keychains",0,"crochet",false,"images/amigurumi-key.jpg",[]]],X={"bulk": ["images/bulk-1.jpg", "images/bulk-2.jpg", "images/bulk-3.jpg", "images/bulk-4.jpg"], "custom": ["images/custom-1.jpg"], "up": ["images/up-1.jpg", "images/up-2.jpg"]};

let cart=JSON.parse("{}"),$=s=>document.querySelector(s),rs=n=>n?"₹"+n.toLocaleString("en-IN"):"Price on request";
const cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}
function add(id,n=1){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];sync()}
function addAll(ids){ids.forEach(i=>cart[i]=(cart[i]||0)+1);sync();toast("Added to your kit")}
function sync(){$("#cc").textContent=cnt();drawer();if(location.hash=="#kit")route()}
const tt=()=>rs(total())+(Object.keys(cart).some(i=>!PK[i].pr)?" + items on request":"");
function total(){return Object.entries(cart).reduce((a,[i,q])=>a+PK[i].pr*q,0)}
function msg(){let l=Object.entries(cart).map(([i,q])=>`• ${PK[i].n} × ${q} (${rs(PK[i].pr)} each)`).join("\n");return `Hello UMANG, I'd like to enquire about this kit:\n${l}\nIndicative total: ${tt()}\nPlease share availability, customisation options and delivery details.`}

function TY(){return [["all","All"],["handmade","Handmade (things)"],["homemade","Homemade (food)"]].map(t=>`<button class="chip ${t[0]==ft?"on":""}" onclick="ft='${t[0]}';route()">${t[1]}</button>`).join("")}
function HM(){return `<section class="sec"><h2>Homemade</h2><p>Dry snacks and catering orders, made at home by the women of UMANG. See what is available and order on WhatsApp.</p><div class="kits"><div class="kit"><h3>Dry snacks</h3><p>Browse snacks, flavours and pack sizes in our WhatsApp catalogue.</p><a class="btn m s" target="_blank" rel="noopener" href="https://wa.me/c/919823618537">Open food catalogue</a></div><div class="kit"><h3>Catering orders</h3><p>Tell us the occasion, number of guests and date. We reply with options and a quote.</p><a class="btn m s" target="_blank" rel="noopener" href="https://wa.me/919823618537?text=${encodeURIComponent('Hello UMANG, I would like to enquire about a catering order. Occasion: , guests: , date: ')}">Ask about catering</a></div></div></section>`}
function home(){const h=["potli-2in1","baby-frock","file-folder","fridge-magnets","laptop-bag","crochet-bow"].map(i=>P.find(p=>p[0]==i));return `<section class="hero"><div><h1>Made by hand. Made by women.</h1><p>Bags, décor, crochet and stationery crafted by the women artisans of UMANG, a sub-brand of YOJAK. Buy one piece or build a whole kit.</p><p><a class="btn m" href="#kit">Build your kit</a> <a class="btn o" href="#shop">Browse the catalogue</a></p></div><div class="mos">${h.map(p=>`<img src="${p[5]}" alt="${p[1]}">`).join("")}</div></section>
<div class="strip"><div><b>100% handmade</b>Every piece is made by a woman artisan</div><div><b>Customisable</b>Colours, logos and quantities for bulk</div><div><b>Upcycled options</b>Old saris and leftover fabric reused</div><div><b>Backed by YOJAK</b>Income goes to women's self-reliance</div></div>
<section class="sec"><h2>Ready-made kits</h2><div class="kits">${KITS.map((k,n)=>`<div class="kit"><div class="th">${k[2].map(i=>`<img src="${PK[i].im}" alt="">`).join("")}</div><h3>${k[0]}</h3><p>${k[1]}</p><button class="btn m s" onclick='addAll(${JSON.stringify(k[2])})'>Add kit · ${rs(k[2].reduce((a,i)=>a+PK[i].pr,0))}</button></div>`).join("")}</div></section>
<section class="sec"><h2>Shop by category</h2><div class="chips">${Object.entries(CATS).map(([c,n])=>`<a class="chip" href="#shop" onclick="fc='${c}';ft='handmade'">${n}</a>`).join("")}<a class="chip" href="#shop" onclick="ft='homemade'">Homemade snacks &amp; catering</a></div></section>
<section class="sec"><h2>What customers say</h2><div class="rv">${REV.slice(0,2).map(r=>rv(r)).join("")}</div><p><a class="btn o" href="#reviews">Read all reviews</a></p></section><section class="sec faq"><h2>Questions</h2>${faq()}</section>`}
function faq(){return [["Can I customise products?","Yes. Colours, sizes, logos and quantities can be customised for bulk orders."],["How do I order?","Add items to your enquiry list and send it. The UMANG team confirms price, timeline and delivery."],["Are the photos exact?","Catalogue photos are indicative. Handmade means each piece is slightly different."],["Do you do corporate gifting?","Yes. Use the kit builder or the Bulk & Custom page."]].map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}
function rv(r){return `<blockquote><div class="st" aria-label="5 stars">★★★★★</div><p>${r[1]}</p><b>${r[2]}</b> <span class="tag">${r[3]}</span><br><span class="tag">${r[0]}</span></blockquote>`}
function kit(){const ids=Object.keys(cart);return `<h1>Make your own kit</h1><p>Pick any products from any category. We pack them together as one gift or order.</p><div class="kb"><div><div class="chips">${["all",...Object.keys(CATS)].map(c=>`<button class="chip ${c==fc?"on":""}" onclick="fc='${c}';route()">${c=="all"?"All":CATS[c]}</button>`).join("")}</div><div class="grid">${P.filter(p=>fc=="all"||p[3]==fc).map(p=>card(p[0])).join("")}</div></div><div class="box"><h2>Your kit</h2>${lines()}<p><b>Indicative total: ${tt()}</b></p><div class="f"><textarea id="note" placeholder="Occasion, colours, name or logo to add" rows="2" aria-label="Notes"></textarea><button class="btn m" onclick="send(1)" ${cnt()?"":"disabled"}>${WA?"Send on WhatsApp":"Send by email"}</button></div></div></div>`}
function story(){return `<h1>The story of UMANG</h1><div class="two"><div><p>UMANG (Umang Mahila Udyog) is a women artisans' collective, empowering women towards self-reliance. Every product is made by hand, and UMANG Products brings that work to customers across India as a sub-brand of YOJAK.</p><p><i>Replace the placeholders below with your real dates and milestones.</i></p></div><div class="pics">${X.custom.slice(0,4).map(s=>`<img src="${s}" alt="UMANG craft">`).join("")}</div></div><h2 style="margin-top:36px">Our journey</h2><div class="tl">${MS.map(m=>`<div><b>${m[0]}</b><h3>${m[1]}</h3><p>${m[2]}</p></div>`).join("")}</div><div class="nums"><div><b>00</b>women artisans</div><div><b>00</b>products made</div><div><b>00</b>bulk orders</div><div><b>00</b>villages reached</div></div><p><small>Replace the 00 figures with real numbers.</small></p>`}
function reviews(){return `<h1>Customer reviews</h1><p>These are sample reviews. Replace them with genuine ones before launch.</p><div class="rv">${REV.map(rv).join("")}</div><h2 style="margin-top:36px">Share your experience</h2><div class="f" style="max-width:520px"><input id="rn" placeholder="Your name" aria-label="Name"><textarea id="rt" rows="3" placeholder="What did you buy and how was it?" aria-label="Review"></textarea><button class="btn" onclick="location.href='mailto:'+EMAIL+'?subject=Review for UMANG Products&body='+encodeURIComponent($('#rt').value+'\n— '+$('#rn').value)">Send review by email</button></div>`}
function custom(){const b=(t,a,k)=>`<section class="sec two"><div><h2>${t}</h2>${a}</div><div class="pics">${X[k].slice(0,4).map(s=>`<img loading="lazy" src="${s}" alt="${t}">`).join("")}</div></section>`;return `<h1>Bulk, custom &amp; upcycled</h1>${b("Bulk orders","<p>Handmade paper bags ₹50–200, cloth bags ₹15–35, newspaper bags ₹5–15.</p>","bulk")}${b("Custom orders","<p>Share your idea, colours or logo and the artisans will make it.</p>","custom")}${b("Upcycling","<p>Curtains and cushions from old saris, table mats from cloth rags, bags from leftover fabric.</p>","up")}<div class="f" style="max-width:520px"><h2>Send an enquiry</h2><input id="cn" placeholder="Name / organisation" aria-label="Name"><input id="cq" placeholder="Product and quantity" aria-label="Product and quantity"><textarea id="cm" rows="3" placeholder="Deadline, customisation, delivery city" aria-label="Details"></textarea><button class="btn m" onclick="location.href='mailto:'+EMAIL+'?subject=Bulk/custom enquiry&body='+encodeURIComponent($('#cn').value+'\n'+$('#cq').value+'\n'+$('#cm').value)">Send enquiry</button></div>`}
const R={home,shop,kit,story,reviews,custom},NV={shop:"Shop",kit:"Make a kit",custom:"Bulk & custom",story:"Our story",reviews:"Reviews"};
function route(){const h=(location.hash||"#home").slice(1);$("#app").innerHTML=(R[h]||home)();$("#nv").innerHTML=Object.entries(NV).map(([k,v])=>`<a href="#${k}" class="${k==h?"on":""}">${v}</a>`).join("");scrollTo(0,0)}
$("#lg").src=LOGO;addEventListener("hashchange",route);route();drawer();
</script></body></html>
